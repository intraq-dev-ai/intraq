<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">IntraQ social preview</title>
  <desc id="desc">Social preview artwork for the IntraQ GitHub repository.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1080" cy="80" r="260" fill="#38BDF8" opacity="0.10"/>
  <circle cx="150" cy="560" r="260" fill="#FCD34D" opacity="0.10"/>

  <g filter="url(#shadow)">
    <rect x="72" y="72" width="1136" height="496" rx="36" fill="#020617" opacity="0.74" stroke="#334155"/>
  </g>

  <text x="120" y="190" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="92" font-weight="800" letter-spacing="-3">
    IntraQ
  </text>
  <rect x="120" y="224" width="420" height="8" rx="4" fill="url(#accent)"/>

  <text x="120" y="310" fill="#FCD34D" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="46" font-weight="750" letter-spacing="-1">
    Self-hosted AI BI
  </text>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="34" font-weight="650">
    <rect x="120" y="360" width="338" height="64" rx="18" fill="#0F172A" stroke="#334155"/>
    <text x="150" y="402" fill="#E2E8F0">Natural Language SQL</text>

    <rect x="486" y="360" width="304" height="64" rx="18" fill="#0F172A" stroke="#334155"/>
    <text x="516" y="402" fill="#E2E8F0">Dashboard Builder</text>

    <rect x="818" y="360" width="310" height="64" rx="18" fill="#0F172A" stroke="#334155"/>
    <text x="848" y="402" fill="#E2E8F0">Embedded Analytics</text>
  </g>

  <text x="120" y="500" fill="#94A3B8" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28" font-weight="500">
    Ask questions of SQL-backed operational data. Generate trusted SQL. Build live dashboards.
  </text>
</svg>
